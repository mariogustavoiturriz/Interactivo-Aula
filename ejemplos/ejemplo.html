<script>

    s.background = el.relleno || 'transparent';
    s.color = el.color || '#1d2430';
    s.fontSize = (el.tam || 24) + 'px';
    s.fontWeight = el.negrita ? '700' : '400';
    s.fontStyle = el.cursiva ? 'italic' : 'normal';
    s.textAlign = el.alinear || 'left';
    s.alignItems = ({arriba: 'flex-start', medio: 'center', abajo: 'flex-end'})[el.vertical || 'medio'];
    s.borderRadius = el.forma === 'circulo' ? '50%' : (el.radio || 0) + 'px';
    d.appendChild(nuevo('div', 'txt', el.texto || ''));
  } else if (tipo === 'video') {
    video();
  } else if (tipo === 'quiz') {
    quiz();
  } else if (tipo === 'ordenar') {
    ordenar();
  } else if (tipo === 'puzzle') {
    rompecabezas();
  } else if (tipo === 'temporizador') {
    temporizador();

    llave();

    cerradura();

    var conCtrl = el.controles !== false;

    function ver(){ var t = Math.ceil(resta); reloj.textContent = Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
    function pitar(){
      try {
        var ac = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.3, 0.6].forEach(function(t){ var o = ac.createOscillator(), gn = ac.createGain(); o.frequency.value = 880; gn.gain.value = 0.15; o.connect(gn); gn.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.18); });

        clearInterval(h); h = null; d.classList.add('fin'); msj.textContent = el.msjFin || '';

    function pausar(){ clearInterval(h); h = null; bPlay.textContent = '▶'; bPlay.setAttribute('aria-label', 'Iniciar'); }
    if (vivo) {

}
(function reproductor(){
  var P = JSON.parse(document.getElementById('datos').textContent);
  var esc = document.getElementById('escena'), marco = document.getElementById('marco');
  var nav = document.getElementById('nav'), num = document.getElementById('num');
  var ant = document.getElementById('ant'), sig = document.getElementById('sig');
  var capa = document.getElementById('capa'), vt = document.getElementById('vt'), vi = document.getElementById('vi'), vx = document.getElementById('vx'), vc = document.getElementById('vc');
  var actual = 0, ultimoFoco = null;
  var conNav = P.navegacion !== false;
  if (!conNav) nav.hidden = true;
  esc.style.width = P.ancho + 'px'; esc.style.height = P.alto + 'px';
  var letraGeneral = P.letra && P.letra !== 'sistema' ? 'f-' + P.letra : '';
  if (letraGeneral) { esc.classList.add(letraGeneral); document.body.classList.add(letraGeneral); }

  function ajustar(){
    var alto = window.innerHeight - (conNav ? nav.offsetHeight : 0);
    var k = Math.min(window.innerWidth / P.ancho, alto / P.alto);
    esc.style.transform = 'scale(' + k + ')';
    marco.style.width = (P.ancho * k) + 'px'; marco.style.height = (P.alto * k) + 'px';
  }
  function indice(id){ for (var i = 0; i < P.pantallas.length; i++) if (P.pantallas[i].id === id) return i; return -1; }
  function mostrar(i){
    if (i < 0 || i >= P.pantallas.length) return;
    actual = i;
    var p = P.pantallas[i];
    esc.innerHTML = '';
    esc.style.backgroundColor = p.fondo || '#ffffff';
    esc.style.backgroundImage = p.fondoImg ? 'url("' + p.fondoImg + '")' : 'none';
    p.elementos.forEach(function(el){
      var n = crearNodo(el, P.medios || {}, true), a = el.accion;
      // actividades resueltas: pasan de pantalla si así se configuró
      var ex = el.exito;
      if (ex && ex.tipo && ex.tipo !== 'ninguna') n.addEventListener('resuelto', function(){
        var desde = actual;
        setTimeout(function(){
          if (actual !== desde) return;
          if (ex.tipo === 'siguiente') mostrar(actual + 1); else if (ex.tipo === 'ir') mostrar(indice(ex.destino));
        }, 1400);
      });
      if (a && a.tipo && a.tipo !== 'ninguna') {
        n.classList.add('activo'); n.tabIndex = 0;
        n.setAttribute('role', a.tipo === 'enlace' ? 'link' : 'button');
        n.setAttribute('aria-label', el.alt || el.texto || 'Elemento interactivo');
        n.addEventListener('click', function(){ ejecutar(a, n); });
        n.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ejecutar(a, n); } });
      }
      esc.appendChild(n);
    });
    num.textContent = (i + 1) + ' / ' + P.pantallas.length;
    ant.disabled = i === 0; sig.disabled = i === P.pantallas.length - 1;
  }
  function ejecutar(a, n){
    if (a.tipo === 'ventana') abrir(a, n);
    else if (a.tipo === 'ir') mostrar(indice(a.destino));
    else if (a.tipo === 'siguiente') mostrar(actual + 1);
    else if (a.tipo === 'anterior') mostrar(actual - 1);
    else if (a.tipo === 'enlace' && a.url) window.open(a.url, '_blank', 'noopener');
  }
  function abrir(a, n){
    ultimoFoco = n;
    var f = [].filter.call(n.classList, function(c){ return c.indexOf('f-') === 0; })[0] || letraGeneral;
    capa.firstChild.className = 'ventana' + (f ? ' ' + f : '');
    vt.textContent = a.titulo || ''; vt.style.display = a.titulo ? '' : 'none';
    vx.textContent = a.texto || '';
    if (a.img) { vi.src = a.img; vi.style.display = ''; } else { vi.removeAttribute('src'); vi.style.display = 'none'; }
    capa.hidden = false; vc.focus();
  }
  function cerrar(){ capa.hidden = true; if (ultimoFoco) ultimoFoco.focus(); }
  vc.addEventListener('click', cerrar);
  capa.addEventListener('click', function(e){ if (e.target === capa) cerrar(); });
  ant.addEventListener('click', function(){ mostrar(actual - 1); });
  sig.addEventListener('click', function(){ mostrar(actual + 1); });
  document.addEventListener('keydown', function(e){
    if (!capa.hidden) { if (e.key === 'Escape') cerrar(); return; }
    if (!conNav || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') mostrar(actual + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') mostrar(actual - 1);
  });
  window.addEventListener('resize', ajustar);
  mostrar(0); ajustar();
})();
</script>
